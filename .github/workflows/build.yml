name: Build Unity APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Project
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          for z in *.zip; do if [ -f "$z" ]; then unzip -o "$z"; rm "$z"; fi; done
          ls -la
      - name: Find Path
        run: |
          F=$(find . -name "ProjectVersion.txt" | head -n 1)
          D=$(dirname $(dirname $F))
          C=$(echo $D | sed 's|^\./||')
          if [ -z "$C" ]; then C="."; fi
          echo "UNITY_PROJECT_PATH=$C" >> $GITHUB_ENV
          echo "Path is $C"
      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD
