name: Request Activation File
on: workflow_dispatch
jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Generate .alf file with Docker
        run: |
          mkdir -p ./alf_output
          chmod 777 ./alf_output
          echo "Running Unity to generate ALF..."
          docker run --rm -v $(pwd)/alf_output:/alf -w /alf --user root unityci/editor:2021.3.16f1-base-1 bash -c "/opt/unity/Editor/Unity -batchmode -createManualActivationFile -logFile /alf/unity.log || true; find /root -name '*.alf' -exec cp -v {} /alf/ \; 2>/dev/null; ls -la /alf/; cat /alf/unity.log || true" || true
          ls -R ./alf_output
          
      - name: Upload .alf file
        uses: actions/upload-artifact@v4
        with:
          name: Manual Activation File
          path: ./alf_output
