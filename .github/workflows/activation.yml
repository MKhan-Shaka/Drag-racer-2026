name: Request Activation File
on: workflow_dispatch
jobs:
  request:
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:2021.3.16f1-base-1
    steps:
      - name: Generate .alf file
        run: |
          /opt/unity/Editor/Unity -batchmode -createManualActivationFile -logFile /tmp/unity.log || true
          cat /tmp/unity.log || true
          find / -type f -name "*.alf" 2>/dev/null | head -20
          mkdir -p /github/workspace/alf
          find /root -name "*.alf" -exec cp {} /github/workspace/alf/ \; 2>/dev/null || true
          find / -name "Unity_lic.alf" -exec cp {} /github/workspace/alf/ \; 2>/dev/null || true
          ls -R /github/workspace/alf/
      - name: Upload .alf file
        uses: actions/upload-artifact@v4
        with:
          name: Manual Activation File
          path: /github/workspace/alf
